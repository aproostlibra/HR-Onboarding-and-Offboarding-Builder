.obf-toast{font-size:13px;color:var(--ok);background:var(--ok-soft);border-radius:6px;padding:7px 10px}
.obf-errs{border:1px solid var(--err);background:var(--err-soft);border-radius:6px;padding:10px 12px;display:grid;gap:6px}
.obf-errs b{color:var(--err);font-size:13.5px}

  }

  var errBox=h("div",{class:"obf-errs",hidden:true});
  var toastEl=h("div",{class:"obf-toast",hidden:true,role:"status"});
  var fnameEl=h("code",{class:"obf-code"});
  var out=h("pre"),countEl=h("span",{class:"obf-count"});

    h("h2",{text:cfg.itEmail?"Versturen naar IT":"Opslaan"}),

    h("div",{class:"obf-btns"},

    h("div",{class:"obf-btns"},h("button",{type:"button",class:"obf-btn quiet",onclick:copyText},"Kopieer tekst")));

  /* ---------- logica ---------- */
  function rowEl(id){return root.querySelector('[data-iid="'+id+'"]');}
  function ruleOn(r,self){var w=(r.when||[]).filter(function(id){return id&&id!==self&&items[id];});return w.length>0&&(r.mode==="any"?w.some(function(id){return on(id);}):w.every(function(id){return on(id);}));}
  function active(it,action){var out=null;(it.rules||[]).forEach(function(r){if(!out&&r.action===action&&ruleOn(r,it.id))out=r;});return out;}
  function names(r){return (r.when||[]).filter(function(id){return items[id]&&(r.mode!=="any"||on(id));}).map(function(id){return items[id].it.label;}).join(r.mode==="any"?" of ":" + ");}
  function isAuto(id){var cb=$(id);return !!(cb&&cb.dataset.st==="auto"&&cb.checked);}
  function apply(){
    fields.forEach(function(f){var w=root.querySelector('[data-fid="'+f.id+'"]');if(w)w.hidden=!visibleField(f);});
    for(var pass=0;pass<10;pass++){var ch=false;
      Object.keys(items).forEach(function(k){var x=items[k],it=x.it,cb=$(k),r=rowEl(k),po=true;
        if(x.parent){po=on(x.parent.id);r.hidden=!po;}
        var ar=active(it,"auto"),byRule=!!ar,br=po?active(it,"blocked"):null;
        var want=po&&!br&&((x.parent&&it.auto)||byRule);
        if(!po){if(cb.checked){cb.checked=false;ch=true;}cb.disabled=false;delete cb.dataset.st;}
        else if(br){if(cb.checked){cb.checked=false;ch=true;}cb.disabled=true;cb.dataset.st="block";}
        else if(want){if(!cb.checked){cb.checked=true;ch=true;}cb.disabled=true;cb.dataset.st="auto";}
        else if(cb.dataset.st){var was=cb.dataset.st;delete cb.dataset.st;cb.disabled=false;if(was==="auto"&&cb.checked){cb.checked=false;ch=true;}}
        r.classList.toggle("obf-blocked",!!br);
        var bt=r.querySelector(".obf-blocktag");bt.hidden=!br;if(br)bt.textContent="Niet mogelijk bij "+names(br);
        var at=r.querySelector(".obf-autotag"),show=po&&!br&&byRule&&!(x.parent&&it.auto);
        at.hidden=!show;if(show)at.textContent="Automatisch";});
      if(!ch)break;}
    Object.keys(items).forEach(function(k){var it=items[k].it,cb=$(k),r=rowEl(k),c=$(k+"_c"),s=$(k+"_s"),tag=r.querySelector(".obf-fixtag");
      var vr=c?active(it,"value"):null,fx=!!(vr&&vr.value&&cb.checked);
      if(c){if(fx){c.value=vr.value;c.disabled=true;}else c.disabled=false;c.hidden=!cb.checked;}
      if(s)s.hidden=!cb.checked;
      tag.hidden=!fx;if(fx){tag.textContent="Vast bij "+names(vr);}
      var rr=active(it,"required"),rt=r.querySelector(".obf-reqtag"),rs=!!(rr&&!cb.checked&&!r.hidden&&cb.dataset.st!=="block");
      rt.hidden=!rs;if(rs)rt.textContent="Verplicht bij "+names(rr);});
  }
  function validate(){
    root.querySelectorAll(".obf-err").forEach(function(e){e.classList.remove("obf-err");});
    var errs=[];
    cfg.blocks.forEach(function(b){
      if(b.type==="fields"){(b.fields||[]).forEach(function(f){
        if(f.required&&visibleField(f)&&!val(f.id))errs.push({msg:"Vul “"+f.label+"” in",el:root.querySelector('[data-fid="'+f.id+'"]'),focus:$(f.id)});});}
      else{(b.items||[]).forEach(function(it){check(it,null,b);(it.subs||[]).forEach(function(s){check(s,it,b);});});}
    });
    function check(it,parent,b){
      if(parent&&!on(parent.id))return;
      if($(it.id)&&$(it.id).dataset.st==="block")return;
      var r=rowEl(it.id);
      var rr=active(it,"required");
      if((it.required||rr)&&!on(it.id)){errs.push({msg:"Vink “"+it.label+"” aan"+(rr&&!it.required?" (verplicht bij "+names(rr)+")":""),el:r,focus:$(it.id)});return;}
      if(!on(it.id))return;
      if(it.choiceRequired&&$(it.id+"_c")&&!val(it.id+"_c"))errs.push({msg:(it.choice==="count"?"Kies een aantal bij “":"Maak een keuze bij “")+it.label+"”",el:r,focus:$(it.id+"_c")});
      if(b.status&&b.statusRequired&&!val(it.id+"_s"))errs.push({msg:"Kies “"+statusLabel+"” bij “"+it.label+"”",el:r,focus:$(it.id+"_s")});
    }
    errs.forEach(function(e){if(e.el)e.el.classList.add("obf-err");});

  }
  function showErrs(errs){
    errBox.innerHTML="";errBox.hidden=!errs.length;if(!errs.length)return;
    errBox.append(h("b",{text:errs.length===1?"Nog 1 verplicht punt open":"Nog "+errs.length+" verplichte punten open"}),
      h("ul",null,errs.map(function(e){return h("li",null,h("button",{type:"button",onclick:function(){if(e.el)e.el.scrollIntoView({block:"center",behavior:"smooth"});if(e.focus)setTimeout(function(){e.focus.focus({preventScroll:true});},250);}},e.msg));})));
  }
  function lines(){
    var t=[(cfg.title||"Aanvraag").toUpperCase(),""],n=0;
    cfg.blocks.forEach(function(b){
      t.push((b.title||"").toUpperCase());
      if(b.type==="fields"){var any=false;(b.fields||[]).forEach(function(f){if(!visibleField(f))return;var v=fval(f);
        if(f.type==="textarea"){if(v){t.push(f.label+":",v);any=true;}}else{t.push(f.label+": "+(v||"-"));any=true;}});if(!any)t.push("-");}

        (it.subs||[]).forEach(function(s){if(on(s.id)){c++;t.push("    - "+s.label+extra(s,b)+(isAuto(s.id)?" (automatisch)":""));}});});
        if(!c)t.push("(geen)");n+=c;}

  }

  /* ---------- PDF ---------- */
  function buildPdf(){
    var doc=new window.jspdf.jsPDF({unit:"mm",format:"a4"});
    var M=16,W=210-2*M,AC=hexRgb(cfg.accent),GR=[90,104,120],LN=[211,218,228],MUTE=[150,160,170];
    var y=14;
    function ensure(hh){if(y+hh>280){doc.addPage();y=18;}}
    var titleW=W;
    if(cfg.logo){try{var lh=16,lw=Math.min(55,lh*(cfg.logoW||1)/(cfg.logoH||1));if(lw<1)lw=lh;var fmt=/^data:image\/jpe?g/i.test(cfg.logo)?"JPEG":"PNG";
      doc.addImage(cfg.logo,fmt,210-M-lw,y-4,lw,lh);titleW=W-lw-6;}catch(e){}}
    doc.setTextColor.apply(doc,AC);doc.setFont("helvetica","bold");doc.setFontSize(17);
    doc.text(doc.splitTextToSize(cfg.title||"Aanvraag",titleW)[0],M,y+3);
    doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor.apply(doc,GR);
    doc.text(fileBase()+"   |   Ingediend "+today(),M,y+9.5,{maxWidth:titleW});
    y+=15;doc.setDrawColor.apply(doc,AC);doc.setLineWidth(.8);doc.line(M,y,M+W,y);y+=9;
    function section(t){ensure(16);doc.setTextColor.apply(doc,AC);doc.setFont("helvetica","bold");doc.setFontSize(12);doc.text(t,M,y);
      doc.setDrawColor.apply(doc,AC);doc.setLineWidth(.4);doc.line(M,y+1.8,M+W,y+1.8);y+=7;}
    cfg.blocks.forEach(function(b,bi){
      section((bi+1)+". "+(b.title||""));
      if(b.type==="fields"){
        doc.setFontSize(10);doc.setLineWidth(.2);
        (b.fields||[]).forEach(function(f){if(!visibleField(f))return;
          var v=fval(f);var ls=doc.splitTextToSize(v||"-",W-62);var hh=Math.max(7,ls.length*4.2+2.8);ensure(hh);
          doc.setDrawColor.apply(doc,LN);doc.setFillColor(242,244,247);doc.rect(M,y,58,hh,"FD");doc.rect(M+58,y,W-58,hh,"S");
          doc.setTextColor(30);doc.setFont("helvetica","bold");doc.text(doc.splitTextToSize(f.label||"",55)[0],M+2,y+4.8);
          doc.setFont("helvetica","normal");doc.text(ls,M+60,y+4.8);y+=hh;});
        y+=7;
      }else{
        var C1=b.status?M+104:M+122,C2=M+146;
        doc.setFontSize(8.5);doc.setTextColor.apply(doc,GR);doc.setFont("helvetica","bold");
        doc.text("Onderdeel",M+8,y);doc.text("Keuze",C1,y);if(b.status)doc.text(statusLabel,C2,y);y+=2.5;
        (b.items||[]).forEach(function(it){prow(it,false,b,C1,C2);if(on(it.id))(it.subs||[]).forEach(function(s){prow(s,true,b,C1,C2);});});
        y+=6;
      }
    });
    function prow(it,sub,b,C1,C2){
      ensure(6.5);var o=on(it.id),x=M+(sub?8:0);
      doc.setDrawColor.apply(doc,LN);doc.setLineWidth(.2);doc.line(M,y+6.5,M+W,y+6.5);
      doc.setDrawColor.apply(doc,o?AC:MUTE);doc.setLineWidth(.35);doc.rect(x+1,y+1.6,3.6,3.6);
      if(o){doc.setLineWidth(.6);doc.line(x+1.7,y+3.5,x+2.6,y+4.5);doc.line(x+2.6,y+4.5,x+4.1,y+2.2);}
      doc.setFontSize(sub?9:10);doc.setFont("helvetica",sub?"normal":"bold");
      if(o)doc.setTextColor(30);else doc.setTextColor.apply(doc,MUTE);
      doc.text(doc.splitTextToSize((it.label||"")+(o&&isAuto(it.id)?"  (automatisch)":""),C1-x-9)[0],x+7,y+4.6);
      doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(30);
      var c=o?val(it.id+"_c"):"";if(c)doc.text(c+(it.choice==="count"?" stuks":""),C1,y+4.6,{maxWidth:(b.status?C2:M+W)-C1-2});
      var s=o&&b.status?val(it.id+"_s"):"";
      if(s){doc.setFont("helvetica","bold");if(s===statusOpts[0])doc.setTextColor(46,107,58);else doc.setTextColor(192,80,0);doc.text(s,C2,y+4.6,{maxWidth:M+W-C2});}
      y+=6.5;
    }
    var n=doc.getNumberOfPages();
    for(var i=1;i<=n;i++){doc.setPage(i);doc.setFont("helvetica","normal");doc.setFontSize(7.5);doc.setTextColor.apply(doc,GR);
      doc.text(cfg.footer||"Vertrouwelijk - bevat persoonsgegevens (AVG)",M,290);doc.text("Pagina "+i+" van "+n,210-M,290,{align:"right"});}
    return doc;
  }
  function mailBody(){

    var fb=null;for(var i=0;i<cfg.blocks.length;i++)if(cfg.blocks[i].type==="fields"){fb=cfg.blocks[i];break;}

  function doSave(andMail){
