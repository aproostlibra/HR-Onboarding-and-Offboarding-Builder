<title>Formulierbouwer Onboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: links een werkbank met tabbladen (Algemeen / Indeling), rechts een vastgezet live voorbeeld van het formulier */
:root{
  --b-bg:#EEF1F5; --b-surface:#FFFFFF; --b-sunk:#F4F6F9; --b-line:#D4DBE5; --b-fg:#17212C; --b-muted:#5B6979;
  --b-accent:#1F4E79; --b-accent-soft:#E1EAF3; --b-on-accent:#FFFFFF; --b-danger:#A8321F; --b-ok:#2E6B3A;
  --b-display:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --b-body:"IBM Plex Sans","Segoe UI",Arial,sans-serif;
  --b-mono:"IBM Plex Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --b-bg:#0F141A; --b-surface:#18202A; --b-sunk:#131A22; --b-line:#2B3644; --b-fg:#E3E8EE; --b-muted:#93A1B1;
  --b-accent:#86B4E0; --b-accent-soft:#1D3044; --b-on-accent:#0E1620; --b-danger:#F08F7D; --b-ok:#8CC79A; color-scheme:dark}}
:root[data-theme="dark"]{
  --b-bg:#0F141A; --b-surface:#18202A; --b-sunk:#131A22; --b-line:#2B3644; --b-fg:#E3E8EE; --b-muted:#93A1B1;
  --b-accent:#86B4E0; --b-accent-soft:#1D3044; --b-on-accent:#0E1620; --b-danger:#F08F7D; --b-ok:#8CC79A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--b-bg);color:var(--b-fg);font-family:var(--b-body);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:0 40px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--b-bg);display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-block:14px;border-bottom:1px solid var(--b-line);margin-bottom:18px}
@media (max-width:700px){.top{position:static}}
.brand{display:grid;gap:2px;min-width:0}
.brand b{font-family:var(--b-display);font-size:22px;letter-spacing:.01em;color:var(--b-accent);line-height:1.1}
.brand span{font-size:13px;color:var(--b-muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.cols{display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1150px){.cols{grid-template-columns:minmax(0,1fr)}}
.btn{font:inherit;font-size:14px;font-weight:600;border-radius:6px;padding:8px 13px;border:1px solid var(--b-accent);cursor:pointer;display:inline-flex;align-items:center;gap:6px;background:transparent;color:var(--b-accent)}
.btn.primary{background:var(--b-accent);color:var(--b-on-accent)}
.btn.small{font-size:13px;padding:5px 10px;font-weight:500}
.btn.quiet{border-color:var(--b-line);color:var(--b-muted);font-weight:500}
.btn.add{border-style:dashed;border-color:var(--b-line);color:var(--b-accent);font-weight:500;width:100%;justify-content:center}
.ib{font:inherit;width:30px;height:30px;border-radius:6px;border:1px solid var(--b-line);background:var(--b-surface);color:var(--b-muted);cursor:pointer;display:inline-grid;place-items:center;flex:none;font-size:15px;line-height:1}
.ib:hover{color:var(--b-fg)}
.ib.del:hover{color:var(--b-danger);border-color:var(--b-danger)}
.ib:disabled{opacity:.35;cursor:default}
:is(.btn,.ib,.tab,input,select,textarea,summary):focus-visible{outline:2px solid var(--b-accent);outline-offset:2px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--b-line);margin-bottom:14px}
.tab{font:inherit;font-size:14px;font-weight:600;background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;color:var(--b-muted);cursor:pointer}
.tab[aria-selected="true"]{color:var(--b-accent);border-bottom-color:var(--b-accent)}
.panel{display:grid;gap:14px}
.card{background:var(--b-surface);border:1px solid var(--b-line);border-radius:8px;padding:14px;display:grid;gap:12px;min-width:0}
.card h3{font-family:var(--b-display);font-size:16px;margin:0}
.kv{display:grid;gap:4px;min-width:0}
.kv > label,.lbl{font-size:12.5px;font-weight:600}
.help{font-size:12.5px;color:var(--b-muted);margin:0}
.in{font:inherit;font-size:14px;color:var(--b-fg);background:var(--b-sunk);border:1px solid var(--b-line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
textarea.in{resize:vertical}
select.in{width:auto;max-width:100%}
.ed-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.ed-row .grow{flex:1 1 130px;width:auto}
.item .ed-row select.in{max-width:132px}
.tog{display:inline-flex;gap:6px;align-items:center;font-size:13px;cursor:pointer;white-space:nowrap;padding:4px 8px;border:1px solid var(--b-line);border-radius:6px;background:var(--b-surface)}
.tog input{accent-color:var(--b-accent);margin:0;width:15px;height:15px}
.tog:has(input:checked){border-color:var(--b-accent);background:var(--b-accent-soft);color:var(--b-accent);font-weight:600}
.block{border:1px solid var(--b-line);border-radius:8px;background:var(--b-surface);min-width:0}
.block-head{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--b-line);background:var(--b-sunk);border-radius:8px 8px 0 0}
.block-head .grow{flex:1 1 200px;width:auto;font-weight:600}
.kind{font-family:var(--b-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--b-muted);background:var(--b-surface);border:1px solid var(--b-line);border-radius:4px;padding:2px 6px}
.block-body{padding:12px;display:grid;gap:10px}
.item{border:1px solid var(--b-line);border-radius:7px;padding:8px;display:grid;gap:6px;background:var(--b-surface);min-width:0}
.item.sub > .ed-row > .grow{flex-basis:100%}
.item.sub{margin-left:18px;border-left:3px solid var(--b-accent-soft)}
details.more > summary{cursor:pointer;font-size:12.5px;color:var(--b-accent);list-style:none;display:inline-flex;gap:6px;align-items:center}
details.more > summary::-webkit-details-marker{display:none}
details.more > summary::before{content:"▸";font-size:11px;transition:transform .15s}
details.more[open] > summary::before{transform:rotate(90deg)}
.more-body{display:grid;gap:10px;padding:10px 2px 4px 14px;border-left:2px solid var(--b-line);margin-top:6px}
.badges{display:inline-flex;gap:4px;flex-wrap:wrap}
.badge{font-size:11px;color:var(--b-muted);background:var(--b-sunk);border:1px solid var(--b-line);border-radius:10px;padding:0 7px}
.inline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:12px;border:1px solid var(--b-line);background:var(--b-sunk);color:var(--b-fg);border-radius:12px;padding:2px 9px;cursor:pointer}
.chip:hover{border-color:var(--b-accent);color:var(--b-accent)}
.example{font-family:var(--b-mono);font-size:12.5px;color:var(--b-muted);overflow-wrap:anywhere}
.logo-box{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.logo-prev{width:180px;height:72px;border:1px dashed var(--b-line);border-radius:6px;display:grid;place-items:center;background:#fff;color:#6B7785;font-size:12px;overflow:hidden}
.logo-prev img{max-width:92%;max-height:62px}
.swatches{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--b-surface);box-shadow:0 0 0 1px var(--b-line);cursor:pointer}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--b-fg)}
input[type=color]{width:40px;height:30px;border:1px solid var(--b-line);border-radius:6px;background:var(--b-surface);padding:2px}
.pv{min-width:0}
.pv-bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.pv-bar b{font-family:var(--b-display);font-size:16px}
.pv-bar span{font-size:12.5px;color:var(--b-muted)}
.pv-frame{border:1px solid var(--b-line);border-radius:10px;overflow:auto;background:var(--b-surface)}
@media (min-width:1151px){.pv{position:sticky;top:calc(env(safe-area-inset-top,0px) + 86px)}.pv-frame{max-height:calc(100vh - 140px)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:20;background:var(--b-fg);color:var(--b-bg);border-radius:8px;padding:10px 14px;display:flex;gap:12px;align-items:center;font-size:13.5px;max-width:calc(100vw - 32px);box-shadow:0 6px 24px rgb(0 0 0 / .25)}
.toast button{font:inherit;font-weight:600;background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.steps{margin:0;padding-left:20px;font-size:13px;color:var(--b-muted);display:grid;gap:3px}
.credit{margin-top:32px;padding-top:14px;border-top:1px solid var(--b-line);text-align:center;font-size:12px;color:var(--b-muted);letter-spacing:.02em}
.rule{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--b-line);border-radius:6px;padding:8px 8px 8px 10px;background:var(--b-sunk);min-width:0}
.rule-body{display:grid;gap:6px;flex:1;min-width:0}
.rule .help{font-size:12px}
.rw{font-weight:600}
.warn{color:var(--b-danger);font-size:12.5px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){details.more > summary::before{transition:none}}
</style>

<style id="form-css">

 --soft:color-mix(in srgb,var(--accent) 13%,#FFFFFF);--ok:#2E6B3A;--ok-soft:#E2EFDA;--err:#B3261E;--err-soft:#FBEAE7;
 color-scheme:light;background:var(--bg);color:var(--fg);font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;font-size:15px;line-height:1.5;padding:28px 16px 48px;container-type:inline-size;min-height:100%}

:root[data-theme="dark"] .obf{--accent:color-mix(in srgb,var(--obf-accent,#1F4E79) 50%,#FFFFFF);--bg:#11161D;--surface:#19212B;--sunk:#141B23;--line:#2C3846;--fg:#E4E9EF;--muted:#94A2B2;--on-accent:#0E1620;--soft:color-mix(in srgb,var(--obf-accent,#1F4E79) 35%,#141B23);--ok:#8CC79A;--ok-soft:#1D3324;--err:#F2A090;--err-soft:#3A1E1A;color-scheme:dark}
.obf *{box-sizing:border-box}
.obf [hidden]{display:none!important}
.obf-wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}
.obf-head{grid-column:1/-1;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:14px;border-bottom:2px solid var(--accent);padding-bottom:14px}
.obf-headtxt{display:grid;gap:4px;min-width:0}
.obf-logo{max-height:56px;max-width:220px;object-fit:contain;background:#FFFFFF;border-radius:6px;padding:4px 6px}
.obf-eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.obf h1{font-size:clamp(24px,4cqi,32px);line-height:1.15;margin:0;text-wrap:balance;color:var(--accent);font-weight:700}
.obf-lead{color:var(--muted);margin:0;max-width:60ch;font-size:14px}
.obf-form{display:grid;gap:18px;min-width:0}
.obf-sec{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 20px 20px;min-width:0}
.obf h2{font-size:18px;margin:0 0 12px;display:flex;gap:10px;align-items:baseline;font-weight:700}
.obf-n{font-size:13px;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.obf-note{font-size:13px;color:var(--muted);margin:-4px 0 12px}
.obf-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.obf-field{display:grid;gap:4px;min-width:0;align-content:start}
.obf-field.full{grid-column:1/-1}
.obf-lbl{font-size:13px;font-weight:600}
.obf-req{color:var(--err);font-weight:700}
.obf-hint{font-size:12px;color:var(--muted)}
.obf input[type=text],.obf input[type=date],.obf select,.obf textarea{font:inherit;font-size:14px;color:var(--fg);background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
.obf textarea{resize:vertical}
.obf :is(input,select,textarea,button,a):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.obf select:disabled{opacity:1;color:var(--accent);font-weight:600;background:var(--soft)}
.obf-list{display:grid;border-top:1px solid var(--line)}
.obf-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line)}
.obf-row.sub{padding-left:30px;background:linear-gradient(90deg,var(--soft) 0 3px,transparent 3px)}
.obf-check{display:flex;gap:10px;align-items:center;cursor:pointer;min-width:0}
.obf-check input{width:18px;height:18px;accent-color:var(--accent);flex:none;margin:0}
.obf-row:not(.sub) > .obf-check > span{font-weight:600}
.obf-check small{font-weight:400;color:var(--muted);font-size:12.5px}
.obf-opts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center}
.obf-opts select{width:auto;padding:5px 8px;font-size:13px}
.obf-tag{font-size:11px;letter-spacing:.03em;text-transform:uppercase;color:var(--accent);background:var(--soft);border-radius:4px;padding:3px 7px;white-space:nowrap}
.obf-field.obf-err input,.obf-field.obf-err select,.obf-field.obf-err textarea{border-color:var(--err);background:var(--err-soft)}

.obf-reqtag{color:var(--err);background:var(--err-soft)}

.obf-to{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.obf-code{font-family:Consolas,"Courier New",monospace;font-size:13px;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:3px 7px;overflow-wrap:anywhere;user-select:all}
.obf pre{font-family:Consolas,"Courier New",monospace;font-size:12px;line-height:1.55;background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:12px;margin:0;white-space:pre-wrap;overflow-wrap:anywhere;max-height:44vh;overflow:auto}
.obf-btns{display:flex;flex-wrap:wrap;gap:8px}
.obf-btn{font:inherit;font-size:14px;font-weight:600;border-radius:6px;padding:10px 14px;border:1px solid var(--accent);cursor:pointer;display:inline-flex;align-items:center;gap:6px;background:transparent;color:var(--accent)}
.obf-btn.primary{background:var(--accent);color:var(--on-accent)}
.obf-btn.quiet{border-color:var(--line);color:var(--muted);font-weight:500}
.obf-steps{margin:0;padding-left:20px;font-size:13px;color:var(--muted);display:grid;gap:2px}
.obf-toast{font-size:13px;color:var(--ok);background:var(--ok-soft);border-radius:6px;padding:7px 10px}
.obf-errs{border:1px solid var(--err);background:var(--err-soft);border-radius:6px;padding:10px 12px;display:grid;gap:6px}
.obf-errs b{color:var(--err);font-size:13.5px}
.obf-errs ul{margin:0;padding-left:18px;display:grid;gap:2px}
.obf-errs button{font:inherit;font-size:13px;background:none;border:0;padding:0;color:var(--fg);text-decoration:underline;cursor:pointer;text-align:left}
.obf-confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.obf-count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.obf-credit{max-width:1180px;margin:32px auto 0;padding-top:14px;border-top:1px solid var(--line);text-align:center;font-size:12px;color:var(--muted);letter-spacing:.02em}
.obf-legend{font-size:12.5px;color:var(--muted);margin:0}
@container (max-width:920px){.obf-wrap{grid-template-columns:minmax(0,1fr)}.obf-aside{position:static}}
@container (max-width:560px){.obf-grid{grid-template-columns:minmax(0,1fr)}.obf-row{grid-template-columns:minmax(0,1fr)}.obf-opts{justify-content:flex-start;padding-left:28px}.obf-sec{padding:16px}}
</style>

<header class="top">
  <div class="brand"><b>Formulierbouwer</b><span>Pas het IT-onboardingformulier aan en sla het op voor het intranet.</span></div>
  <div class="actions">
    <label class="btn" for="openFile">Bestaand formulier openen</label>
    <input type="file" id="openFile" class="vh" accept=".html,.htm,.json">
    <button type="button" class="btn primary" id="saveHtml">Formulier opslaan (HTML)</button>
  </div>
</header>

<main class="cols">
  <div class="editor">
    <div class="tabs" role="tablist">
      <button type="button" class="tab" role="tab" id="tabGen" aria-selected="true" aria-controls="panelGen">Algemeen</button>
      <button type="button" class="tab" role="tab" id="tabLay" aria-selected="false" aria-controls="panelLay">Indeling en velden</button>
    </div>
    <div id="panelGen" class="panel" role="tabpanel" aria-labelledby="tabGen"></div>
    <div id="panelLay" class="panel" role="tabpanel" aria-labelledby="tabLay" hidden></div>
  </div>
  <div class="pv">
    <div class="pv-bar"><b>Voorbeeld</b><span>Werkt echt: probeer aan te vinken en klik op “Alleen PDF opslaan” om de verplichte velden te testen.</span></div>
    <div class="pv-frame"><div id="pv"></div></div>
  </div>
</main>
<footer class="credit" id="credit"></footer>
<div id="toast" class="toast" role="status" hidden></div>

      if(r.action==="auto"&&(own.indexOf(x)>-1||leadsTo(x.id,it.id)))return true;
      return false;}
    var cond=h("div",{class:"inline"},h("span",{class:"rw",text:"Als"}));
    r.when.forEach(function(id,j){
      if(j===1)cond.append(sel(r,"mode",[["all","en"],["any","of"]],true,"en of of"));
      else if(j>1)cond.append(h("span",{class:"rw",text:r.mode==="any"?"of":"en"}));
      cond.append(itemSelect(r.when,j,"Kies een onderdeel…",function(x){return excl(x,j);},"Voorwaarde "+(j+1),
        function(){r.when=r.when.filter(function(v,k){return v||k===0;});}));
      if(j>0)cond.append(ib("✕","Voorwaarde weghalen",function(){r.when.splice(j,1);rebuild();}));
    });
    cond.append(h("span",{text:(r.when.length>1&&r.mode!=="any")?"zijn aangevinkt,":"is aangevinkt,"}));
    if(r.when[r.when.length-1])cond.append(h("button",{type:"button",class:"btn small quiet",onclick:function(){r.when.push("");rebuild();}},"+ nog een onderdeel"));
    var acts=ACTS.filter(function(a){return a[0]!=="value"||hasChoice||r.action==="value";});
    var act=h("div",{class:"inline"},h("span",{class:"rw",text:"dan wordt dit onderdeel"}),sel(r,"action",acts,true,"Wat er gebeurt"));
    if(r.action==="value"){
      if(hasChoice)act.append(sel(r,"value",[["","Kies…"]].concat((it.options||[]).map(function(o){return[o,o];})),true,"Vaste keuze"));
      else act.append(h("span",{class:"warn",text:"Stel eerst bij ‘Na aanvinken’ een keuzelijst in."}));
    }
    var note=r.action==="value"?"De keuze staat vast zodra dit onderdeel is aangevinkt; aanvinken blijft vrij."
      :r.action==="required"?"Het formulier kan pas worden opgeslagen als dit onderdeel is aangevinkt."
      :r.action==="blocked"?"Wordt uitgevinkt en grijs; HR kan het dan niet aanvinken."
      :"Gaat vanzelf aan en kan dan niet worden uitgezet.";
    box.append(h("div",{class:"rule"},h("div",{class:"rule-body"},cond,act,h("p",{class:"help",text:note})),
      ib("✕","Regel verwijderen",function(){del(it.rules,ri,"Regel");},"del")));
  });
  box.append(h("button",{type:"button",class:"btn small add",onclick:function(){it.rules.push({action:"auto",when:[""]});openSet.add("i-"+kOf(it,"m"));rebuild();}},"+ Regel toevoegen"));
  return box;
}
function itemEditor(list,i,block,parent){
  var it=list[i];
  var badges=[];
  if(it.choice==="list")badges.push("keuzelijst");if(it.choice==="count")badges.push("aantal");
  OBF.normalize({blocks:[{type:"checklist",items:[it]}]});
  if(it.rules.length)badges.push(it.rules.length===1?"1 regel":it.rules.length+" regels");if(!parent&&it.subs&&it.subs.length)badges.push(it.subs.length+" sub-onderdelen");
  var kids=[kv("Toelichting achter de naam",txt(it,"hint",{label:"Toelichting",ph:"Optioneel, bijvoorbeeld: meerdere keuzes mogelijk"})),
    h("div",{class:"inline"},h("span",{text:"Na aanvinken:"}),sel(it,"choice",[["","Geen extra keuze"],["list","Keuze uit een lijst"],["count","Aantal kiezen"]],true,"Extra keuze"))];
  if(it.choice==="list"||it.choice==="count"){
    kids.push(kv(it.choice==="count"?"Aantallen (één per regel)":"Keuzes (één per regel)",listArea(it,"options","Eén per regel")));
    kids.push(h("div",{class:"ed-row"},tog(it,"choiceRequired","Keuze verplicht")));
  }
  kids.push(rulesEditor(it,parent));
  var subWrap=null;
  if(!parent){
    it.subs=it.subs||[];
    subWrap=h("div",{class:"kv"},h("span",{class:"lbl",text:"Sub-onderdelen"}),
      h("p",{class:"help",text:"Verschijnen pas als het hoofdonderdeel is aangevinkt. ‘Automatisch’ = gaat vanzelf mee aan."}),
      it.subs.map(function(s,j){return itemEditor(it.subs,j,block,it);}),
      h("button",{type:"button",class:"btn small add",onclick:function(){var n=I(uid(),"Nieuw sub-onderdeel");it.subs.push(n);openSet.add("i-"+kOf(it,"m"));rebuild();focusLabel(n);}},"+ Sub-onderdeel"));
    kids.push(subWrap);
  }
  return h("div",{class:"item"+(parent?" sub":"")},
    h("div",{class:"ed-row"},txt(it,"label",{cls:"grow",label:"Naam",ph:"Naam"}),
      tog(it,"required",parent?"Verplicht":"Verplicht aanvinken"),parent?tog(it,"auto","Automatisch"):null,ctrl(list,i,it.label)),
    more("i-"+kOf(it,"m"),"Meer opties",badges,kids));
}
function focusLabel(obj){var key=(obj.fields||obj.items)?"title":"label";setTimeout(function(){var n=document.querySelector('[data-k="'+kOf(obj,key)+'"]');if(n){n.focus();n.select();n.scrollIntoView({block:"center"});}},30);}

function setTab(which){
  var gen=which==="gen";

  document.getElementById("panelGen").hidden=!gen;document.getElementById("panelLay").hidden=gen;

}

function escHtml(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function buildHtml(){
  var css=document.getElementById("form-css").textContent;
  var rt=document.getElementById("runtime").textContent;
  var json=JSON.stringify(cfg).replace(/</g,"\\u003c");
  return "<!doctype html>\n<html lang=\"nl\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>"+escHtml(cfg.title||"Formulier")+"</title>\n"+
    "<script src=\""+JSPDF+"\"><\/script>\n<style>\nhtml,body{margin:0;min-height:100%}\n"+css+"\n</style>\n</head>\n<body>\n<div id=\"app\"></div>\n"+
    "<!-- Gemaakt met de Formulierbouwer. Open dit bestand in de Formulierbouwer om het aan te passen. -->\n"+
    "<script id=\"form-config\" type=\"application/json\">"+json+"<\/script>\n<script>"+rt+"<\/script>\n"+
    "<script>OBF.render(document.getElementById(\"app\"),JSON.parse(document.getElementById(\"form-config\").textContent));<\/script>\n</body>\n</html>\n";
}
window.__buildHtml=buildHtml;
document.getElementById("saveHtml").addEventListener("click",function(){
  var name=(cfg.title||"Formulier").replace(/[\\\/:*?"<>|]+/g,"").trim()+".html";
  saveFile(name,buildHtml(),"text/html").then(function(r){
    if(r==="declined")toast("Opslaan geannuleerd.");else toast("Opgeslagen als “"+name+"”. Zet dit bestand op het intranet of SharePoint.");
  },function(e){toast("Opslaan lukte niet: "+e.message);});
});
document.getElementById("openFile").addEventListener("change",function(ev){
  var f=ev.target.files&&ev.target.files[0];ev.target.value="";if(!f)return;
  var r=new FileReader();r.onload=function(){
    var t=String(r.result),c=null;
    try{if(/\.json$/i.test(f.name))c=JSON.parse(t);else{var m=/<script id="form-config" type="application\/json">([\s\S]*?)<\/script>/.exec(t);if(m)c=JSON.parse(m[1]);}}catch(e){c=null;}
    if(!c||!Array.isArray(c.blocks)){toast("Dit bestand is niet met de Formulierbouwer gemaakt en kan niet worden geopend.");return;}
    undoSnap=clone(cfg);cfg=OBF.normalize(Object.assign(clone(DEFAULT),c));rebuild();toast("“"+f.name+"” geopend.",true);
  };r.readAsText(f);
});
